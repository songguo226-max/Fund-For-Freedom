[project]
name = "fund-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "akshare>=1.18",
    "yfinance>=0.2.63",
    "scrapling>=0.4.11",
    "patchright>=1.61.2",
    "playwright>=1.61.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
